[Group]
key1=65
key2=68

[Group]
key3=83
key4=87

[Settings]
releaseDelayMinMs=1
releaseDelayMaxMs=8
releaseTapDurationMs=110
releaseTapHoldThresholdMs=250


# 修改并保存后，请在界面点击“重启并应用”。
# 也可以继续使用界面中的按键编辑区调整这四个按键。
# releaseDelayMinMs / releaseDelayMaxMs：同组新按键接管旧按键时，释放旧按键前的随机延迟范围（毫秒）。
# releaseTapDurationMs：松开某键并等待随机延迟后，自动短按同组另一键的固定持续时间（毫秒）；设为 0 可关闭。
# releaseTapHoldThresholdMs：按住某键达到该时长后，松开才会触发自动短按；设为 0 表示不限制。
# 更多按键绑定说明：https://github.com/cafali/SnapKey/wiki/Rebinding-Keys

# 常用默认方案：
# AZERTY: key1=81 key2=68 / key3=90 key4=83
# QWERTY: key1=65 key2=68 / key3=83 key4=87
# 方向键: key1=38 key2=40 / key3=37 key4=39
